<!DOCTYPE html>
<html lang="en-us">

<head>
    <base href="https://cdn.jsdelivr.net/gh/theredstonepro316/web-port@latest/ultrakill/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | ULTRAKILL</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #loading-text {
            color: black;
            font-family: cursive;
            font-size: 32px;
            text-align: center;
            margin-top: 20px;
            position: fixed;
            width: 100%;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>

<body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <div id="loading-text">LOADING...</div>
    <canvas id="unity-canvas" tabindex="-1" hidden></canvas>
    <script src="Build/ultrakill.loader.js"></script>
    <script>
        var canvas = document.querySelector("#unity-canvas");
        var loadingText = document.querySelector("#loading-text");

        // Fetch large binary parts from raw.githubusercontent.com to avoid jsDelivr's 20MB limit
        const RAW_BASE = "https://raw.githubusercontent.com/theredstonepro316/web-port/main/ultrakill/";
        const totalParts = 6; // 4 data parts + 2 wasm parts
        let completedParts = 0;

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.position = "fixed";
            document.body.style.textAlign = "left";
        } else {
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function mergeFiles(fileParts, label) {
            return new Promise((resolve, reject) => {
                let buffers = [];

                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        loadingText.textContent = `Merging ${label} files...`;
                        let mergedBlob = new Blob(buffers);
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        resolve(mergedFileUrl);
                        return;
                    }

                    const currentFile = fileParts[index];
                    loadingText.textContent = `Downloading ${currentFile} (${completedParts}/${totalParts} parts done)...`;

                    fetch(RAW_BASE + currentFile)
                        .then((response) => {
                            if (!response.ok) {
                                throw new Error(`HTTP ${response.status} while loading ${currentFile}`);
                            }
                            return response.arrayBuffer();
                        })
                        .then((data) => {
                            buffers.push(data);
                            completedParts++;
                            fetchPart(index + 1);
                        })
                        .catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        Promise.all([
            mergeFiles(getParts("Build/ultrakill.data.unityweb", 1, 4), "Game Data"),
            mergeFiles(getParts("Build/ultrakill.wasm.unityweb", 1, 2), "WebAssembly")
        ]).then(([dataUrl, wasmurl]) => {
            loadingText.textContent = "Starting Unity engine (0%)...";
            canvas.hidden = false;

            createUnityInstance(canvas, {
                dataUrl: dataUrl,
                frameworkUrl: "Build/ultrakill.framework.js.unityweb",
                codeUrl: wasmurl,
                streamingAssetsUrl: RAW_BASE + "StreamingAssets",
                companyName: "Hakita and Cake Logic",
                productName: "ULTRAKILL",
                productVersion: "1.4",
            }, (progress) => {
                const percent = Math.round(progress * 100);
                loadingText.textContent = `Initializing Unity engine (${percent}%)...`;
            }).then(() => {
                loadingText.remove();
            }).catch((err) => {
                loadingText.style.color = "red";
                loadingText.textContent = `Unity Error: ${err}`;
            });
        }).catch((err) => {
            loadingText.style.color = "red";
            loadingText.textContent = `Download Error: ${err.message}`;
        });
    </script>
</body>

</html>
